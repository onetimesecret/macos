# Two lanes, both required (docs/spec/07-repo-skeleton.md):
#   logic    — ubuntu: the crates that hold all the logic, cheap and fast
#   platform — macos:  full workspace, incl. the pasteboard adapter
#
# Future jobs, recorded here rather than forgotten:
#   - signing + notarization (a release-engineering ADR of its own)
#   - frugality-budget assertions (docs/spec/05): download size, resident
#     memory, idle wakeups — measurable only once a binary exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  logic:
    name: logic (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show # respects rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p companion-core -p ots-client -p companion-credentials -p companion-ffi -p companion-transport --all-targets -- -D warnings
      - name: Test
        run: cargo test -p companion-core -p ots-client -p companion-credentials -p companion-ffi -p companion-transport
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  platform:
    name: platform (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (full workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (full workspace)
        run: cargo test --workspace

  # The Swift/AppKit shell (ADR-0002): build the C-ABI seam as a
  # universal xcframework, then build and test the Swift package against
  # it. --dev-scaffolding stays until drop-to-seal gets its
  # boundary-lawful design (the shell still links the dev-seed symbol).
  shell:
    name: shell (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build CompanionCore.xcframework
        run: ./scripts/build-core.sh --dev-scaffolding
      - name: swift build
        run: swift build --package-path shell
      - name: swift test
        run: swift test --package-path shell
      # --debug reuses the build above; the step exists to keep the
      # bundle assembly (Info.plist, stamping, codesign) from rotting.
      - name: Assemble CompanionApp.app
        run: ./scripts/build-app.sh --debug

  # A backstop for the "never commit a secret" rule (adopted from the
  # prototype skeleton, PR #5). Scans the full history, so checkout is
  # unshallow. The binary is version-pinned AND checksum-verified (from
  # the release's checksums.txt): the tool that reads the whole history
  # must not itself be an unverified download. Bump both together.
  # Intentionally-fake test fixtures are allowlisted by fingerprint in
  # .gitleaksignore, which gitleaks reads from the source root.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
      GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full-history scan)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact
