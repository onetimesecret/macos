# Two lanes, both required (docs/spec/07-repo-skeleton.md):
#   logic    — ubuntu: the crates that hold all the logic, cheap and fast
#   platform — macos:  full workspace, incl. the pasteboard adapter
#
# Future jobs, recorded here rather than forgotten:
#   - signing + notarization (a release-engineering ADR of its own)
#   - frugality-budget assertions (docs/spec/05): download size, resident
#     memory, idle wakeups — measurable only once a binary exists.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  logic:
    name: logic (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show # respects rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - name: Verify pinned Betlang package and model
        run: |
          cargo fetch --locked
          ./scripts/verify-betlang.py
          python3 -m unittest scripts/tests/test_verify_betlang.py
      - name: Reproduce language threshold selection
        run: |
          python3 tools/language-eval/select-thresholds.py \
            --cases tools/language-eval/reports/2026-09-14/selection/baseline-tune-cases.jsonl \
            --grid tools/language-eval/data/threshold-grid.json \
            --output /tmp/threshold-selection.json \
            --markdown-output /tmp/threshold-selection.md \
            --expect-candidate tools/language-eval/data/tuned-candidate.json
          cmp /tmp/threshold-selection.json tools/language-eval/reports/2026-09-14/selection/threshold-selection.json
          cmp /tmp/threshold-selection.md tools/language-eval/reports/2026-09-14/selection/threshold-selection.md
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p companion-core -p language-eval -p ots-client -p companion-credentials -p companion-ffi -p companion-sync -p companion-transport --all-targets -- -D warnings
      - name: Test
        run: cargo test -p companion-core -p language-eval -p ots-client -p companion-credentials -p companion-ffi -p companion-sync -p companion-transport
      # cargo test enables no features on its own (cargo issue 2911),
      # so the gated test seams (ADR-0018) are exercised by name here
      # and stay absent from every run above.
      - name: Test (test-util seams)
        run: cargo test -p companion-ffi --features test-util
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  platform:
    name: platform (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (full workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (full workspace)
        run: cargo test --workspace
      # The shape above enables no features (cargo issue 2911), so a
      # test gated on `feature = "test-util"` never runs in it. The
      # ubuntu lane covers the seams for the crates that build there,
      # but it cannot reach anything also gated on macOS, and nothing
      # stops the next seam test from being both. Running the same
      # workspace once more with the feature on is what keeps that test
      # from silently existing nowhere. `--features test-util` resolves
      # against the virtual manifest because companion-ffi is the one
      # member that declares it (crates/ffi/Cargo.toml).
      - name: Test (full workspace, test-util seams)
        run: cargo test --workspace --features test-util

  # The Swift/AppKit shell (ADR-0002): build the C-ABI seam as a
  # universal xcframework, then build and test the Swift package against
  # it.
  shell:
    name: shell (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The dev shape, test seams included (ADR-0018): swift test links
      # companion_new_ephemeral, which only a --test-util build exports.
      # scripts/test-shell.sh builds that shape itself, so CI runs the
      # tests through the same entry point a developer uses rather than
      # restating the flag here. The debug bundle assembled below
      # inherits the same shape; only the release packaging path is
      # required to be seam-free, and package-app.sh checks that.
      - name: swift build
        run: |
          ./scripts/build-core.sh --if-stale --test-util
          swift build --package-path shell
      - name: swift test
        run: ./scripts/test-shell.sh
      # --debug reuses the build above; the step exists to keep the
      # bundle assembly (Info.plist, stamping, codesign) from rotting.
      - name: Assemble the app bundle
        run: |
          ./scripts/package-app.sh --debug
          # ADR-0012: a debug build must land on its own bundle id, or
          # a dev instance shares defaults, keychain items, and state
          # with the installed copy. Checked by name, because the shell
          # recognises the dev lane by this exact string
          # (FormFactor.devBundleIdentifier) and any other id would
          # resolve to the release fallback.
          id="$(plutil -extract CFBundleIdentifier raw dist/OnetimePad.app/Contents/Info.plist)"
          case "$id" in
            dev.onetimesecret.pad.debug) echo "bundle id: $id" ;;
            *) echo "expected the dev bundle id dev.onetimesecret.pad.debug, got: $id" >&2; exit 1 ;;
          esac
          # ADR-0016 case 2: the assembled plist must declare
          # NSSupportsSuddenTermination. Opting in is what makes
          # PageModel's SuddenTerminationLatch the real gate on the
          # logout kill rather than a clause satisfied by the accident
          # of never having opted in, so dropping the key would quietly
          # turn the latch into decoration. The source plist is already
          # pinned by CompanionKitTests' BundleDeclarationTests, which
          # deliberately stops there: SwiftPM never builds the .app, so
          # Bundle.main under xctest is the test runner and carries none
          # of these keys. The reach no Swift test has is the packaging
          # script itself dropping or overriding the key on the way into
          # dist/OnetimePad.app, and that is the regression this step
          # exists for. Both halves are wanted; neither replaces the
          # other.
          sudden="$(plutil -extract NSSupportsSuddenTermination raw dist/OnetimePad.app/Contents/Info.plist)"
          test "$sudden" = "true" \
            || { echo "expected NSSupportsSuddenTermination true, got: $sudden" >&2; exit 1; }
          # The pre-signature digest is the published artifact; an
          # empty file means the hash pipeline broke silently.
          test -s dist/OnetimePad.presig.sha256 \
            || { echo "dist/OnetimePad.presig.sha256 is missing or empty" >&2; exit 1; }
          cmp THIRD_PARTY_NOTICES.md dist/OnetimePad.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          cmp THIRD_PARTY_NOTICES.md bindings/CompanionCore.xcframework/THIRD_PARTY_NOTICES.md
          cat dist/OnetimePad.presig.sha256

  # The release lane, which exists for the checks that only the release
  # configuration reaches. package-app.sh refuses to ship a binary
  # exporting a test seam (ADR-0018), and that nm check is guarded on
  # `CONFIG == release`, so before this job it ran only when a human
  # packaged a release. It is its own job rather than another step on
  # the shell job because the two need opposite cores: the shell job
  # builds bindings/ with --test-util so swift test can link the seams,
  # and a release package must be built from a core without them.
  # Sharing a job would mean rebuilding the xcframework twice in one
  # workspace and trusting the order. Signing stays out of scope: no
  # local environment file exists, so package-app.sh signs ad-hoc, which is
  # enough for every assertion here.
  package-release:
    name: release packaging (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The packaging scripts' own tests. Several of them skip
      # themselves anywhere but macOS (Apple's plist tools, lockf,
      # swiftc), and the one step that ran a script test sits in the
      # ubuntu lane and names a single file, so the entitlement, build
      # number, lane and profile checks ran on nobody's machine but a
      # developer's. They go first because they need no build and fail
      # in seconds. Discovery is used, not a list of files, so the next
      # test added beside these is run without anyone remembering to
      # name it here; -v prints each skip, so a test that quietly stops
      # running on this runner shows in the log.
      - name: Test the packaging scripts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build CompanionCore.xcframework (release shape, no seams)
        run: ./scripts/build-core.sh
      # The seam check lives inside this script and fails it, so the
      # step passing is the check passing.
      - name: Package the release bundle
        run: ./scripts/package-app.sh
      - name: Check the shipped bundle
        run: |
          # The mirror of the debug job's assertion: the local lane's
          # release bundle carries its own identifier (the shell's
          # FormFactor.localBundleIdentifier) and nothing else, so it
          # cannot collide with the dev lane or an App Store build on
          # defaults, keychain items, or the state directory they
          # derive from it (ADR-0012, and ADR-0016 case 4).
          id="$(plutil -extract CFBundleIdentifier raw dist/OnetimePad.app/Contents/Info.plist)"
          case "$id" in
            dev.onetimesecret.pad) echo "bundle id: $id" ;;
            *) echo "expected the local bundle id dev.onetimesecret.pad, got: $id" >&2; exit 1 ;;
          esac
          # ADR-0016 case 2, on the plist that actually ships. The
          # debug job carries the note on why the packaged bundle, and
          # not only the source plist, is worth asserting.
          sudden="$(plutil -extract NSSupportsSuddenTermination raw dist/OnetimePad.app/Contents/Info.plist)"
          test "$sudden" = "true" \
            || { echo "expected NSSupportsSuddenTermination true, got: $sudden" >&2; exit 1; }
          test -s dist/OnetimePad.presig.sha256 \
            || { echo "dist/OnetimePad.presig.sha256 is missing or empty" >&2; exit 1; }
          cmp THIRD_PARTY_NOTICES.md dist/OnetimePad.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          cmp THIRD_PARTY_NOTICES.md bindings/CompanionCore.xcframework/THIRD_PARTY_NOTICES.md
          test "$(cat bindings/CompanionCore.features)" = "release"
          cat dist/OnetimePad.presig.sha256

  # The ADR conventions (docs/adr/README.md) are structural enough to
  # check: required metadata, the four sections every record carries,
  # and links that resolve. It checks nothing about content or length.
  adr-lint:
    name: ADR conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than inherited from the runner image, so that a
      # runner image changing its default python cannot change what this
      # job runs. The linter is plain 3.x, so the pin is about
      # reproducibility, not about a feature floor.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint ADRs
        run: python3 scripts/lint-adrs.py docs/adr

  # A backstop for the "never commit a secret" rule (adopted from the
  # prototype skeleton, PR #5). Scans the full history, so checkout is
  # unshallow. The binary is version-pinned AND checksum-verified (from
  # the release's checksums.txt): the tool that reads the whole history
  # must not itself be an unverified download. Bump both together.
  # Intentionally-fake test fixtures are allowlisted by fingerprint in
  # .gitleaksignore, which gitleaks reads from the source root.
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
      GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full-history scan)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact
