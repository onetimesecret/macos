name: Nightly macOS

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-macos
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    if: github.repository == 'onetimesecret/macos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Read the GitLab main commit
        id: main
        run: |
          sha="$(git ls-remote https://gitlab.com/onetimesecret/macos.git refs/heads/main | cut -f1)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  platform:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 40
    env:
      RUST_BACKTRACE: '1'
      TEST_SHA: ${{ needs.resolve.outputs.sha }}
      ONETIMEPAD_ENVIRONMENTS_DIR: ${{ github.workspace }}/.ci-environments/${{ github.run_id }}/platform
    steps:
      - name: Checkout the GitLab main commit
        run: |
          git init .
          git remote add origin https://gitlab.com/onetimesecret/macos.git
          git fetch --depth=1 origin "$TEST_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          mkdir -p "$ONETIMEPAD_ENVIRONMENTS_DIR"
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (full workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (full workspace)
        run: cargo test --workspace -- --nocapture
      - name: Test (full workspace, test-util seams)
        run: cargo test --workspace --features test-util -- --nocapture

  shell:
    needs: resolve
    runs-on: macos-26
    timeout-minutes: 40
    env:
      TEST_SHA: ${{ needs.resolve.outputs.sha }}
      ONETIMEPAD_ENVIRONMENTS_DIR: ${{ github.workspace }}/.ci-environments/${{ github.run_id }}/shell
    steps:
      - name: Checkout the GitLab main commit
        run: |
          git init .
          git remote add origin https://gitlab.com/onetimesecret/macos.git
          git fetch --depth=1 origin "$TEST_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          mkdir -p "$ONETIMEPAD_ENVIRONMENTS_DIR"
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build test-util core and Swift shell
        run: |
          ./scripts/build-core.sh --if-stale --test-util
          swift build --package-path shell
      - name: Test Swift shell
        run: ./scripts/test-shell.sh
      - name: Check RevealLab
        run: python3 scripts/ci/check-reveal-lab.py
      - name: Assemble and check the debug bundle
        run: |
          ./scripts/package-app.sh --debug
          bash scripts/ci/check-bundle.sh debug
