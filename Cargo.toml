[workspace]
resolver = "2"
members = ["crates/ots-core", "crates/ots-ffi"]

[workspace.package]
edition = "2021"
license = "MIT"
# The dependency ecosystem (edition-2024 crates in the zeroize/reqwest/idna
# trees) sets the real floor. Bumped deliberately from the spec's original 1.83
# per docs/01 §6 ("pin a real floor; bump deliberately").
rust-version = "1.86"

[workspace.lints.rust]
# Unsafe is allowed only where it is unavoidable (page locking in `secret.rs`
# and the C ABI in `ots-ffi`) and must be justified inline with an
# `#[allow(unsafe_code)]` plus a `// SAFETY:` note. Everywhere else it warns,
# and CI's `-D warnings` turns that warning into a hard failure.
unsafe_code = "warn"

[workspace.lints.clippy]
all = "deny"

# A small, security-focused core builds fast in debug; keep release honest.
[profile.release]
opt-level = 2
lto = "thin"
