# Virtual workspace for the Onetime Secret macOS companion.
#
# Layout follows docs/spec/07-repo-skeleton.md: logic crates (`core`,
# `ots-client`) carry no macOS dependencies and build/test on Linux;
# `pasteboard` is the sole crate allowed to touch platform FFI.
# `shell/` stays empty until ADR-0002 selects a shell; `spikes/` is
# excluded from the workspace by construction.

[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/credentials",
  "crates/ffi",
  "crates/ots-client",
  "crates/pasteboard",
  "crates/transport",
]
# tauri-panel is Rust but not product code — a disposable ADR-0002 spike
# (spikes/README.md) with its own Cargo.lock and target/.
exclude = ["spikes/tauri-panel"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/onetimesecret/macos"
rust-version = "1.94"

[workspace.dependencies]
zeroize = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
# Zeroize-on-drop is the security posture; `unsafe` would let a crate
# sidestep it invisibly. Only `pasteboard` (and later the shell glue) may
# carve out an allowance, arriving together with the FFI code that needs
# it — so the unsafe surface stays auditable by crate boundary.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Curated pedantic subset (doc 07): high signal, low ceremony.
uninlined_format_args = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
needless_pass_by_value = "deny"
match_same_arms = "deny"
items_after_statements = "deny"
doc_markdown = "deny"

[profile.release]
# panic = "unwind" ON PURPOSE. "abort" is the usual size win, but aborting
# skips Drop — and zeroize-on-drop *is* the security posture (doc 05).
# Unwinding panics scrub buffers on the way down. Do not "optimize" this.
panic = "unwind"
lto = "thin"
strip = "symbols"
opt-level = "s"
