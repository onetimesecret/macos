[package]
name = "companion-core"
version = "0.25.0"
description = "Sheet store for the Onetime Secret macOS companion: ink + sealed chips, pausable per-page countdowns, the session ledger, zeroizing buffers. No UI, no macOS dependencies."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
zeroize = { workspace = true }
companion-language-detection-policy = { path = "../language-detection-policy" }
# Experimental ADR-0029 source-language classifier. Exact pin: model, labels,
# and inference behavior require deliberate review before any upgrade.
betlang = "=0.1.1"
# The OS CSPRNG, for minting random 128-bit item identities (ADR-0012).
# Already in the workspace lock by way of ring, so this adds no new
# supply chain.
getrandom = "0.2"
# The CRDT document engine behind SheetDocument (ADR-0013, architecture 3):
# per-edit identity, commit timestamps and messages, Peritext-informed
# marks, and shallow snapshots that approximate the compaction ceremony.
# Pinned exactly because loro declares no MSRV and our toolchain is pinned
# in rust-toolchain.toml; bumps are deliberate, reviewed events. Default
# features stay off: `counter` is a container type we do not use, and
# logging stays out of a crate that handles plaintext. Supply-chain delta:
# loro pulls its own workspace (loro-internal, loro-common, loro-delta,
# loro-rle, loro-kv-store, fractional_index) plus general-purpose deps
# (serde/postcard encoding, smallvec/fxhash-style collections, tracing as
# a facade with no subscriber installed here); reviewed by cargo-deny with
# allowances annotated in deny.toml.
loro = { version = "=1.13.9", default-features = false }

[target.'cfg(unix)'.dependencies]
# SecretBuffer page locking (mlock/munlock) and core-dump disabling.
libc = "0.2"

[dev-dependencies]
# Examples only: the demo REPL runs the conceal call through the client crate,
# a real transport, and Keychain-or-guest credentials; copies out
# through the in-memory pasteboard.
ots-client = { path = "../ots-client" }
companion-pasteboard = { path = "../pasteboard" }
companion-transport = { path = "../transport" }
companion-credentials = { path = "../credentials" }
# Compile-time proof that SecretBuffer implements no duplication or
# serialization traits.
static_assertions = "1"
serde = { workspace = true }

[[example]]
name = "demo"
