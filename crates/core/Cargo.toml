[package]
name = "companion-core"
version = "0.1.0"
description = "Cell store, TTL scheduling, zeroizing buffers, and secret-shape heuristics for the Onetime Secret macOS companion. No UI, no macOS dependencies."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
# SecretBuffer page locking (mlock/munlock) and core-dump disabling.
libc = "0.2"

[dev-dependencies]
# Examples only: the demo REPL dry-runs promotion through the client crate
# and copies out through the in-memory pasteboard.
ots-client = { path = "../ots-client" }
companion-pasteboard = { path = "../pasteboard" }
# Compile-time proof that SecretBuffer implements no duplication or
# serialization traits.
static_assertions = "1"
serde = { workspace = true }

[[example]]
name = "demo"
