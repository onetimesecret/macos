[package]
name = "companion-credentials"
version = "0.2.0"
description = "Credential storage for the Onetime Secret macOS companion: the CredentialStore contract, an in-memory dev fallback, and the macOS Keychain implementation."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The workspace-wide `unsafe_code` deny stays in force at the crate
# level. `src/lib.rs`'s `data_protection` module carves out its own
# module-scoped `#![allow(unsafe_code)]` for the raw SecItem calls
# ADR-0012 requires, so the unsafe surface stays auditable by module,
# the same discipline `companion-pasteboard` follows.
[lints]
workspace = true

[dependencies]
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The Keychain path; compiled and validated only in the platform lane.
security-framework = "2"
# The data protection keychain path (ADR-0012). security-framework 2.11
# builds its generic-password dictionaries from kSecClass, kSecAttrService
# and kSecAttrAccount only, so every item it writes lands in the legacy
# login keychain and kSecAttrAccessible is dropped on the floor; its
# search options cannot name a keychain at all. So that store is built
# from raw SecItem calls over the sys crate. OSX_10_15 is what declares
# kSecUseDataProtectionKeychain; it is off by default.
security-framework-sys = { version = "2", features = ["OSX_10_15"] }
core-foundation = "0.9"
