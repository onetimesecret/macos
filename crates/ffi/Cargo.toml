[package]
name = "companion-ffi"
version = "0.33.0"
description = "The C-ABI seam for the Onetime Secret macOS companion: the only crate a non-Rust shell may call. Hands out opaque handles and non-secret JSON — never plaintext."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# staticlib: the .xcframework; cdylib: off-macOS smoke tests; rlib: tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[features]
# Test seams only; never in a release build (ADR-0018).
test-util = []

[dependencies]
# File bookmarks cross the C ABI as base64 strings.
base64 = "0.22"
companion-core = { path = "../core" }
companion-credentials = { path = "../credentials" }
companion-pasteboard = { path = "../pasteboard" }
companion-sync = { path = "../sync" }
companion-transport = { path = "../transport" }
ots-client = { path = "../ots-client" }
# State-file encryption (src/persist.rs).
ring = "0.17"
serde_json = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Open flags for the erase path (src/persist.rs).
libc = "0.2"
