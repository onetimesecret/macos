[package]
name = "companion-ffi"
version = "0.1.1"
description = "The C-ABI seam for the Onetime Secret macOS companion: the only crate a non-Rust shell may call. Hands out opaque handles and non-secret JSON — never plaintext."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# staticlib feeds the .xcframework (scripts/build-core.sh); cdylib lets
# the seam be smoke-tested off macOS; rlib keeps `cargo test` natural.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The plaintext-ingest dev shim (companion_dev_seed_pasteboard), needed
# only until the NSPasteboard adapter lands (issue #3). Off by default:
# a normal build exports no entry point that moves plaintext across the
# seam. The spike opts in via `scripts/build-core.sh --dev-scaffolding`.
dev-scaffolding = []

[lints]
workspace = true

[dependencies]
companion-core = { path = "../core" }
companion-credentials = { path = "../credentials" }
companion-pasteboard = { path = "../pasteboard" }
companion-transport = { path = "../transport" }
ots-client = { path = "../ots-client" }
# State-file encryption (ChaCha20-Poly1305, src/persist.rs). Already in
# the tree via companion-transport → ureq → rustls: no new supply chain.
ring = "0.17"
serde_json = { workspace = true }
# Named only to spell the `Pasteboard::write` signature the `Board`
# backend delegates to; the bytes stay zeroizing end to end.
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# confstr(_CS_DARWIN_USER_TEMP_DIR): the per-user temp directory macOS
# clears at boot, which is where the boot half of the content key lives
# (src/persist.rs, ADR-0012). Already in the workspace lock by way of
# companion-core, so this adds no new supply chain.
libc = "0.2"
