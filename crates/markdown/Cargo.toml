[package]
name = "companion-markdown"
version = "0.1.0"
description = "The rendered page preview's Markdown reader: CommonMark and GFM by comrak, each sealed object an atom placed by the R1 ownership rules (docs/spec/design/2026-1016-markdown-dialects-and-preview.md)."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Issue 332: one Rust parser for both dialects in place of the vendored
# cmark and cmark-gfm. Default features pull in the CLI and syntect.
comrak = { version = "0.57.0", default-features = false }
serde = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# comrak's own entity table, built from this crate; already in the tree.
entities = "1.0.1"
# SHA-256 of the copied spec corpus, as crates/ffi and crates/sync already use it.
ring = "0.17"
serde_json = { workspace = true }
