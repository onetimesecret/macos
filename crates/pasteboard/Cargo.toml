[package]
name = "companion-pasteboard"
version = "0.2.0"
description = "Pasteboard adapter for the Onetime Secret macOS companion: NSPasteboard on macOS, plus the hygiene vocabulary (ConcealedType, transient, clear-after-copy) shared by every implementation."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This is the one crate permitted to write `unsafe` (doc 07) — the FFI
# surface stays auditable by crate boundary. The workspace-wide deny
# stays in force here at the crate level; `src/macos.rs` carves out its
# own module-scoped `#![allow(unsafe_code)]` for the objc2 calls, so the
# unsafe surface is auditable by module, not just by crate.
[lints]
workspace = true

[dependencies]
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# default-features off: AppKit/Foundation's "default" feature enables
# hundreds of unrelated classes (NSButton, NSApplication, ...); we want
# exactly the pasteboard surface, both for the frugality budget (doc 05)
# and to keep the unsafe surface auditable.
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSPasteboard",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "NSArray",
  "NSString",
] }
