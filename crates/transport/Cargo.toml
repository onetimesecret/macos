[package]
name = "companion-transport"
version = "0.1.0"
description = "The one concrete HTTP transport this workspace ships for ots-client: a TLS-only ureq::Agent (rustls). ots-client stays sans-IO by design; the transport and TLS stack are the integrator's choice, made once, here (docs/spec/05)."
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ots-client = { path = "../ots-client" }
# default-features off: skip gzip/cookies/charset — a single small JSON
# POST doesn't need them, and the frugality budget (doc 05) says no.
ureq = { version = "3", default-features = false, features = ["rustls"] }
