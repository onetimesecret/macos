# cargo-deny gates from commit one (doc 07): advisories deny, licenses
# allowlisted to permissive so distribution stays simple.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not vulnerable: atomic-polyfill is archived upstream,
  # reached through loro's postcard/heapless encoding stack (ADR-0013).
  # On our aarch64 target the polyfill compiles down to the native
  # atomics it exists to imitate elsewhere, so nothing of it is load
  # bearing here. Revisit when loro bumps postcard past heapless 0.7.
  { id = "RUSTSEC-2023-0089", reason = "archived transitive polyfill; native atomics on our targets" },
  # Unmaintained, not vulnerable: bodil archived im and its two support
  # crates on 2026-05-03, all three on the same day. They reach us only
  # through loro-internal, which pins `im ^15.1.0` as of loro 1.13.9,
  # the newest release. The maintained fork (imbl) is not a drop in for
  # loro, so there is no upgrade that removes them and no version of
  # ours that can. None of the three is a vulnerability: each says only
  # that upstream stopped. im does carry a separate soundness advisory,
  # RUSTSEC-2023-0126, an aliasing violation in OrdSet insertion with no
  # fixed version. It is not ignored here and is not what fails the
  # gate: cargo-deny leaves unsound advisories out of scope for
  # transitive crates by default, so whether that path is reachable is
  # loro's use of im to answer, not ours. Revisit when loro moves to
  # imbl, and drop these three lines the moment it does.
  { id = "RUSTSEC-2026-0248", reason = "im archived upstream; pinned by loro-internal, no fix available" },
  { id = "RUSTSEC-2026-0247", reason = "bitmaps archived upstream; reached only through im" },
  { id = "RUSTSEC-2026-0251", reason = "sized-chunks archived upstream; reached only through im" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  # Required by unicode-ident (transitive via serde); permissive,
  # data-file attribution only.
  "Unicode-3.0",
  # Required by webpki-roots (transitive via ureq/rustls, companion-transport):
  # Mozilla's CA bundle, redistributed under a permissive data license.
  "CDLA-Permissive-2.0",
  # Required by im and friends (bitmaps, sized-chunks; transitive via
  # loro-internal, ADR-0013): file-level copyleft that obliges sharing
  # modifications to the covered files only. We link the crates
  # unmodified, so distribution stays as simple as under the permissive
  # set.
  "MPL-2.0",
  # Required by xxhash-rust (transitive via loro): the Boost license,
  # permissive, attribution required in source distributions only.
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version pin;
# this exemption applies only to publish = false crates, so anything
# headed for crates.io still needs real version requirements.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
