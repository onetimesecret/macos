<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">OnetimePad multiple pads — active folder-bound pad</title>
  <desc id="desc">A dark macOS window. A compact pad selector above the existing Files and Timeline sections scopes both to the major-loon worktree.</desc>
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303033"/>
      <stop offset="1" stop-color="#242426"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <style>
      .ui{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace}
      .ink{fill:#e7e7ea}.quiet{fill:#aaaab0}.muted{fill:#74747a}.ember{fill:#ff5a2b}
      .hair{stroke:#48484d;stroke-width:1}
    </style>
  </defs>

  <rect width="1440" height="960" fill="#111113"/>
  <g filter="url(#shadow)">
    <rect x="34" y="28" width="1372" height="884" rx="18" fill="url(#window)" stroke="#55555a"/>
  </g>
  <path d="M52 28h1336a18 18 0 0 1 18 18v36H34V46a18 18 0 0 1 18-18Z" fill="#2d2d30"/>
  <circle cx="58" cy="54" r="6" fill="#ff5f57"/>
  <circle cx="78" cy="54" r="6" fill="#febc2e"/>
  <circle cx="98" cy="54" r="6" fill="#28c840"/>
  <text x="720" y="59" text-anchor="middle" class="ui quiet" font-size="14" font-weight="600">major-loon — OnetimePad</text>
  <path d="M1294 48h16v12h-16zM1297 44h10l2 4h-14z" fill="#ff5a2b"/>
  <text x="1320" y="59" class="ui muted" font-size="13">saved</text>
  <rect x="1360" y="39" width="30" height="30" rx="8" fill="#3e3e42"/>
  <path d="M1375 46v15m-5-10h10m-8 10h6" stroke="#d1d1d5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sidebar -->
  <rect x="34" y="82" width="278" height="830" fill="#1c1c1f"/>
  <line x1="312" y1="82" x2="312" y2="912" class="hair"/>

  <!-- Pad context switcher -->
  <text x="54" y="112" class="ui muted" font-size="11" font-weight="700" letter-spacing="1.6">PAD</text>
  <rect x="48" y="126" width="250" height="68" rx="10" fill="#303034" stroke="#55555b"/>
  <path d="M64 147h14l4 5h23v19H64Z" fill="none" stroke="#d6d6da" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="116" y="153" class="ui ink" font-size="15" font-weight="650">major-loon</text>
  <text x="116" y="175" class="mono muted" font-size="10">…/worktrees/macos/major-loon</text>
  <path d="M274 153l5 5 5-5" fill="none" stroke="#aaaab0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="271" y="101" width="27" height="22" rx="6" fill="#303034"/>
  <path d="M284.5 106v12m-6-6h12" stroke="#ff754f" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Files -->
  <text x="54" y="232" class="ui muted" font-size="11" font-weight="700" letter-spacing="1.6">FILES</text>
  <path d="M58 250h12l5 5v17H58zM70 250v5h5" fill="none" stroke="#9b9ba2" stroke-width="1.2"/>
  <text x="84" y="264" class="mono ink" font-size="13">what.txt</text>
  <circle cx="283" cy="259" r="4" fill="#ff5a2b"/>
  <path d="M58 285h12l5 5v17H58zM70 285v5h5" fill="none" stroke="#6f6f75" stroke-width="1.2"/>
  <text x="84" y="299" class="mono quiet" font-size="13">handoff.md</text>

  <!-- Timeline -->
  <text x="54" y="350" class="ui muted" font-size="11" font-weight="700" letter-spacing="1.6">TIMELINE</text>
  <path d="M284 342v14m-7-7h14" stroke="#ff754f" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="73" y1="380" x2="73" y2="820" stroke="#414146" stroke-width="2"/>
  <circle cx="73" cy="406" r="6" fill="#ff5a2b"/>
  <text x="94" y="401" class="mono ink" font-size="14" font-weight="650">Today</text>
  <text x="94" y="423" class="mono quiet" font-size="12">09:14</text>
  <line x1="108" y1="445" x2="224" y2="445" stroke="#55555b"/>
  <line x1="108" y1="455" x2="204" y2="455" stroke="#48484d"/>
  <line x1="108" y1="465" x2="240" y2="465" stroke="#55555b"/>
  <line x1="108" y1="475" x2="190" y2="475" stroke="#48484d"/>
  <circle cx="73" cy="524" r="5" fill="#65656b"/>
  <text x="94" y="521" class="mono quiet" font-size="13">Yesterday</text>
  <text x="94" y="542" class="mono muted" font-size="12">17:42</text>
  <line x1="108" y1="565" x2="218" y2="565" stroke="#444449"/>
  <line x1="108" y1="575" x2="238" y2="575" stroke="#4f4f54"/>
  <line x1="108" y1="585" x2="178" y2="585" stroke="#444449"/>
  <circle cx="73" cy="640" r="5" fill="#65656b"/>
  <text x="94" y="637" class="mono quiet" font-size="13">3 days ago</text>
  <text x="94" y="658" class="mono muted" font-size="12">21:06</text>
  <rect x="46" y="376" width="246" height="112" rx="10" fill="none" stroke="#ff5a2b" stroke-opacity=".45"/>
  <text x="54" y="884" class="mono muted" font-size="11">1 file unsaved · 3 live pages</text>

  <!-- Editor -->
  <rect x="313" y="82" width="1093" height="830" fill="#28282b"/>
  <text x="356" y="125" class="mono quiet" font-size="13">what.txt</text>
  <circle cx="427" cy="120" r="4" fill="#ff5a2b"/>
  <text x="1362" y="125" text-anchor="end" class="mono muted" font-size="11">…/major-loon/what.txt</text>
  <line x1="348" y1="144" x2="1370" y2="144" class="hair"/>

  <text x="360" y="205" class="mono ink" font-size="23" font-weight="650">major-loon checkout</text>
  <text x="360" y="253" class="mono ink" font-size="20">- reproduce the sidebar restore bug</text>
  <text x="360" y="289" class="mono ink" font-size="20">- compare OTSSNAP4 payload before/after</text>
  <text x="360" y="325" class="mono ink" font-size="20">- keep the plain-file save boundary explicit</text>
  <text x="360" y="397" class="mono quiet" font-size="17">The file belongs to the worktree. The pad remembers where it is.</text>
  <line x1="352" y1="840" x2="1370" y2="840" stroke="#46464b"/>
  <text x="360" y="875" class="ui muted" font-size="12">Changes are staged in the app until Save writes what.txt</text>
  <rect x="1260" y="852" width="110" height="36" rx="9" fill="#3d3d42" stroke="#55555b"/>
  <text x="1315" y="875" text-anchor="middle" class="ui ink" font-size="13" font-weight="600">Save File</text>

  <text x="40" y="944" class="ui muted" font-size="11">Proposal · pad = durable context · files remain files · pages keep their independent expiry</text>
</svg>
