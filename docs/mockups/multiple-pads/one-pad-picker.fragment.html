<!-- Design exploration. The timeline sidebar intentionally approximates the real implementation; its behaviour is not the focus of this work. -->

  <div class="p-window">

</div>

<script>
(()=>{
  const root=document.getElementById('otp-one-picker');
  const folderPaths=['~/Projects/familia','~/Projects/familia/docs','~/Projects/otto','~/Projects/textprov','~/Documents/dog-jokes','~/Documents/familia-notes'];
  const pads=[
    {id:'scratch',name:'Scratch',files:[],notes:['A thought before the next meeting.\n\nKeep the editor close to the work.','Loose notes\n\nOne idea, while it is still useful.','A question to return to\n\nKeep the writing surface close.']},
    {id:'familia',name:'Familia',files:['handoff.md','what.txt'],notes:['Model relationships\n\nCheck how the references behave after a rename.','Migration notes\n\nTry the next change against a small local example.','Next check\n\nReturn to the relationship tests.']},
    {id:'otto',name:'Otto',files:['routes.md'],notes:['Routing notes\n\nKeep the handler contract small.','Review the authentication flow\n\nCheck the redirect before the next build.','Before the next build\n\nCheck the wording for the error response.']},
    {id:'textprov',name:'TextProv',files:[],notes:['Text provenance\n\nWrite down the assumptions before the experiment.','Selection boundaries\n\nKeep the sample and its attribution together.','Next experiment\n\nCompare the two small examples.']},
    {id:'dog-jokes',name:'Dog Jokes',files:[],notes:['Why did the dog sit in the shade?\n\nIt did not want to be a hot dog.','What do you call a dog magician?\n\nA labracadabrador.','A joke for later\n\nThis one needs another walk.']}
  ];
  const times=['09:12','11:46','14:08'];
  const dom={window:root.querySelector('.p-window'),toolbar:root.querySelector('.p-toolbar'),picker:root.querySelector('.p-picker'),name:root.querySelector('.p-active-name'),folders:root.querySelector('.p-selected-folders'),menu:root.querySelector('.p-menu'),rail:root.querySelector('.p-rail'),files:root.querySelector('.p-file-list'),paper:root.querySelector('.p-paper'),position:root.querySelector('.p-current-position'),message:root.querySelector('.p-message'),chooser:root.querySelector('.p-chooser')};
  function normalize(value){
    const defaults={version:3,pad:1,folders:[[],[0,1],[2],[],[4]],positions:[1,1,2,0,1],menuOpen:false,fullPath:false,appAssociations:true,dayOrder:false,checkpointOrder:[false,false],day:0};
    if(!value||value.version!==3)return defaults;
    const claimed=new Set();
    const folders=pads.map((_,index)=>{
      if(index===0)return [];
      const supplied=Array.isArray(value.folders?.[index])?value.folders[index]:defaults.folders[index];
      return supplied.filter(folder=>{if(!Number.isInteger(folder)||folder<0||folder>=folderPaths.length||claimed.has(folder))return false;claimed.add(folder);return true;});
    });
    return {...defaults,pad:Number.isInteger(value.pad)&&value.pad>=0&&value.pad<pads.length?value.pad:1,folders,positions:pads.map((_,index)=>Number.isInteger(value.positions?.[index])&&value.positions[index]>=0&&value.positions[index]<times.length?value.positions[index]:defaults.positions[index]),menuOpen:typeof value.menuOpen==='boolean'?value.menuOpen:true,fullPath:value.fullPath===true,appAssociations:value.appAssociations===true,dayOrder:value.dayOrder===true,checkpointOrder:[value.checkpointOrder?.[0]===true,value.checkpointOrder?.[1]===true],day:value.day===1?1:0};
  }
  const state=normalize(window.openai?.widgetState?.privateContent?.onePadPicker);
  let choosing=false,chosenFolder=-1,chooserPad=-1,replacingFolder=-1,message='';
  function el(tag,cls,text){const item=document.createElement(tag);if(cls)item.className=cls;if(text!==undefined)item.textContent=text;return item;}
  function icon(name){const item=el('i');item.dataset.lucide=name;item.setAttribute('aria-hidden','true');return item;}
  function button(text,action,cls){const item=el('button','cursor-interaction '+(cls||''),text);item.type='button';item.onclick=action;return item;}
  function folderName(index){return folderPaths[index].split('/').pop();}
  function folderOwner(folder){return state.folders.findIndex(list=>list.includes(folder));}
  function remember(){window.openai?.setWidgetState?.({modelContent:{mockup:'one-pad-picker',selectedPad:pads[state.pad].name,selectedFolders:state.folders[state.pad].map(index=>folderPaths[index]),pickerOpen:state.menuOpen,appAssociations:state.appAssociations,fullPaths:state.fullPath,dayOrder:state.dayOrder,checkpointOrder:state.checkpointOrder},privateContent:{onePadPicker:state}})?.catch(()=>{});}

  function selectPad(index){state.pad=index;state.menuOpen=false;message='';commit();dom.picker.focus();}
  function openChooser(pad,folder=-1){

    chooserPad=pad;replacingFolder=folder;chosenFolder=folder>=0?folder:folderPaths.findIndex((_,index)=>folderOwner(index)<0);choosing=true;state.menuOpen=false;message='';render();dom.chooser.querySelector('button:not(:disabled)')?.focus();

  }
  function renderMenu(){
    dom.menu.replaceChildren();dom.menu.hidden=!state.menuOpen;dom.picker.setAttribute('aria-expanded',String(state.menuOpen));
    if(!state.menuOpen)return;

      const top=el('div','p-pad-top');const choose=button('',()=>selectPad(index),'p-pad-row');choose.setAttribute('aria-current',String(index===state.pad));choose.setAttribute('aria-label','Select '+pad.name);
      const check=el('span','p-check');if(index===state.pad)check.append(icon('check'));choose.append(el('span','p-pad-name',pad.name),check);const shortcut=el('span','p-shortcut','⌘'+index);shortcut.setAttribute('aria-hidden','true');choose.append(shortcut);top.append(choose);item.onclick=event=>{if(!event.target.closest('button,input,label,.p-binding-name'))selectPad(index);};
      item.append(top);
      if(index===0)item.append(el('div','p-scratch-help','Usual page expiry across restarts.'));
      if(index>0){
        const bindings=el('div','p-bindings');
        state.folders[index].forEach(folder=>{
          const row=el('div','p-binding-row');const change=el('span','p-binding-name');change.dataset.tooltip=folderPaths[folder];change.append(icon('folder'),el('span','',state.fullPath?folderPaths[folder]:folderName(folder)));
          const remove=button('',()=>{state.folders[index]=state.folders[index].filter(value=>value!==folder);message='Folder removed from '+pad.name;commit();},'p-unlink');remove.append(icon('x'));remove.setAttribute('aria-label','Remove '+folderName(folder)+' folder from '+pad.name);remove.dataset.tooltip='Remove folder association';row.append(change,remove);bindings.append(row);
        });

      }

    });

  }
  const dayNames=['Today','Yesterday'];
  const previousTimes=['08:30','13:15'];
  function orderedCheckpoints(day){const indexes=day===0?[0,1,2]:[0,1];return state.checkpointOrder[day]?indexes.reverse():indexes;}
  function sortButton(label,reverse,action){const item=button('',action,'p-sort');item.append(icon(reverse?'arrow-up-wide-narrow':'arrow-down-wide-narrow'));item.setAttribute('aria-label',label);item.dataset.tooltip=label;return item;}
  function renderPaper(){
    dom.paper.replaceChildren();
    orderedCheckpoints(state.day).forEach(index=>{
      const entry=el('section','p-entry'+(index===state.positions[state.pad]?' is-current':''));
      entry.append(el('div','p-stamp',(state.day===0?times:previousTimes)[index]),el('div','p-copy',pads[state.pad].notes[index]));dom.paper.append(entry);
    });
  }
  function renderSidebar(){
    dom.rail.replaceChildren();
    const dayButton=root.querySelector('.p-sort-days');dayButton.replaceChildren(icon(state.dayOrder?'arrow-down-wide-narrow':'arrow-up-wide-narrow'));dayButton.setAttribute('aria-label',state.dayOrder?'Show newest days first':'Show oldest days first');dayButton.dataset.tooltip=dayButton.getAttribute('aria-label');dayButton.onclick=()=>{state.dayOrder=!state.dayOrder;commit();};
    (state.dayOrder?[1,0]:[0,1]).forEach(day=>{
      const group=el('section','p-day-group');const heading=el('div','p-day-heading');
      heading.append(button(dayNames[day],()=>{state.day=day;commit();},'p-day'),sortButton('Sort '+dayNames[day]+' checkpoints '+(state.checkpointOrder[day]?'oldest':'newest')+' first',state.checkpointOrder[day],()=>{state.checkpointOrder[day]=!state.checkpointOrder[day];commit();}));group.append(heading);
      orderedCheckpoints(day).forEach(index=>{
        const item=button((day===0?times:previousTimes)[index],()=>{state.day=day;state.positions[state.pad]=index;state.menuOpen=false;commit();},'p-time');item.setAttribute('aria-pressed',String(day===state.day&&index===state.positions[state.pad]));
        const minimap=el('span','p-minimap');minimap.setAttribute('aria-hidden','true');for(let mark=0;mark<5;mark++){const line=el('i');line.style.width=(30+(index*7+mark*17+state.pad*11)%60)+'%';minimap.append(line);}item.append(minimap);group.append(item);
      });dom.rail.append(group);
    });
    dom.files.replaceChildren();if(!pads[state.pad].files.length)dom.files.append(el('span','p-file','No files'));else pads[state.pad].files.forEach(file=>dom.files.append(el('span','p-file',file)));
  }
  function renderChooser(){
    dom.chooser.replaceChildren();dom.chooser.hidden=!choosing;dom.toolbar.inert=choosing;root.querySelector('.p-body').inert=choosing;
    if(!choosing)return;
    dom.chooser.append(el('div','p-chooser-heading',(replacingFolder>=0?'Change folder for ':'Add folder to ')+pads[chooserPad].name),el('div','p-secondary','Folder chooser preview · sample locations'));
    if(replacingFolder>=0)dom.chooser.append(el('div','p-chooser-context','Replacing '+folderPaths[replacingFolder]));
    const options=el('div','p-folder-options');folderPaths.forEach((path,index)=>{
      const owner=folderOwner(index);const unavailable=owner>=0&&index!==replacingFolder;
      const row=button('',()=>{chosenFolder=index;renderChooser();globalThis.lucide?.createIcons?.();},'p-folder-option');row.setAttribute('aria-pressed',String(index===chosenFolder));row.disabled=unavailable;
      const text=el('span');text.append(el('span','',folderName(index)),el('span','p-secondary',path));if(unavailable)text.append(el('span','p-secondary','Linked to '+pads[owner].name));row.append(icon('folder'),text);options.append(row);
    });
    const actions=el('div','p-chooser-actions');const confirm=button(replacingFolder>=0?'Change Folder':'Link Folder',()=>{
      if(chosenFolder<0)return;
      const owner=folderOwner(chosenFolder);if(owner>=0&&chosenFolder!==replacingFolder)return;
      const target=chooserPad;const slot=state.folders[target].indexOf(replacingFolder);if(slot>=0)state.folders[target][slot]=chosenFolder;else state.folders[target].push(chosenFolder);choosing=false;chooserPad=-1;replacingFolder=-1;state.menuOpen=true;message='Folder linked to '+pads[target].name;commit();dom.picker.focus();
    },'p-primary');confirm.disabled=chosenFolder<0;actions.append(button('Cancel',closeChooser),confirm);dom.chooser.append(options,actions);
  }
  function render(){
    dom.name.textContent=pads[state.pad].name;dom.picker.setAttribute('aria-label','Choose pad, current pad '+pads[state.pad].name);dom.folders.replaceChildren();
    if(state.pad>0){const count=state.folders[state.pad].length;const tally=el('span','p-folder-tally');tally.append(icon('folder'),el('span','',count+' '+(count===1?'folder':'folders')));dom.folders.append(tally);}
    const apps=root.querySelector('.p-associated-apps');apps.replaceChildren();
    const associations=[[],['Zed','Terminal'],['Zed'],['TextEdit'],['Safari']];
    if(state.appAssociations)associations[state.pad].forEach(name=>{const app=button('',()=>{message='Switch to '+name+' · simulated in this mockup';dom.message.textContent=message;},'p-app-icon');app.dataset.tooltip='Switch to '+name;app.setAttribute('aria-label','Switch to '+name+' (mockup)');app.append(icon({Zed:'square-terminal',Terminal:'terminal',TextEdit:'file-pen-line',Safari:'compass'}[name]));apps.append(app);});
    dom.position.textContent=pads[state.pad].name+' · '+dayNames[state.day]+' · '+((state.day===0?times:previousTimes)[state.positions[state.pad]]||times[0]);dom.message.textContent=message;
    renderMenu();renderSidebar();renderPaper();renderChooser();globalThis.lucide?.createIcons?.({attrs:{width:15,height:15}});
    reserveSpace();
  }
  function reserveSpace(){const needed=choosing?Math.max(665,110+dom.chooser.scrollHeight+40):state.menuOpen?Math.max(665,dom.toolbar.offsetTop+dom.toolbar.offsetHeight+dom.menu.scrollHeight+80):665;dom.window.style.minHeight=needed+'px';}
  dom.picker.onclick=()=>{state.menuOpen=!state.menuOpen;message='';commit();};
  root.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(choosing){event.preventDefault();closeChooser();}else if(state.menuOpen){event.preventDefault();state.menuOpen=false;commit();dom.picker.focus();}});
  root.addEventListener('click',event=>{if(!choosing&&state.menuOpen&&event.target.isConnected&&!event.target.closest('.p-toolbar')&&!event.target.closest('.p-chooser')){state.menuOpen=false;commit();}});
  window.addEventListener('openai:set_globals',event=>{const saved=event.detail?.globals?.widgetState?.privateContent?.onePadPicker;if(!saved)return;Object.assign(state,normalize(saved));choosing=false;chooserPad=-1;replacingFolder=-1;message='';render();});
  render();
  const sizing=new ResizeObserver(reserveSpace);[dom.toolbar,dom.menu,dom.chooser].forEach(element=>sizing.observe(element));
  window.addEventListener('keydown',event=>{root.classList.toggle('p-command-held',event.metaKey);if(event.metaKey&&!event.ctrlKey&&!event.altKey&&/^[0-4]$/.test(event.key)&&!choosing){event.preventDefault();selectPad(Number(event.key));}});
  window.addEventListener('keyup',event=>root.classList.toggle('p-command-held',event.metaKey));
  window.addEventListener('blur',()=>root.classList.remove('p-command-held'));
})();
</script>
