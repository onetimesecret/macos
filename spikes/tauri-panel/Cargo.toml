[package]
name = "tauri-panel"
version = "0.1.0"
edition = "2021"
publish = false

# Excluded from the workspace (root Cargo.toml) — this is ADR-0002 spike
# evidence, not product code (spikes/README.md).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
companion-core = { path = "../../crates/core" }
companion-pasteboard = { path = "../../crates/pasteboard" }
tokio = { version = "1", features = ["time"] }

# The objc2 side-door spikes/README.md calls for: Tauri's window is a
# plain NSWindow with no non-activating-panel concept, and its own
# show()/set_visible() hard-codes makeKeyAndOrderFront (tao's
# platform_impl/macos/window.rs). Reaching the same "never steals focus"
# behavior PanelController.swift gets from NSPanel means bypassing
# Tauri's visibility API entirely and driving the raw NSWindow here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSWindow",
  "NSResponder",
] }
