<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Companion (tauri-panel spike)</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: rgba(28, 28, 30, 0.85);
    color: #eee;
    user-select: none;
  }
  h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 8px;
    font-family: ui-monospace, monospace;
  }
  #drop {
    border: 1px dashed #666;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    color: #aaa;
  }
  #drop.over { border-color: #eee; color: #eee; }
  ul { list-style: none; padding: 0; margin: 10px 0 0; }
  li {
    background: rgba(255,255,255,0.06);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
    font-size: 12px;
    font-family: ui-monospace, monospace;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  button {
    background: none;
    border: 1px solid #555;
    border-radius: 4px;
    color: #eee;
    font-size: 11px;
    padding: 2px 6px;
  }
</style>
</head>
<body>
  <h1>Companion (tauri-panel spike)</h1>
  <div id="drop">drop text here</div>
  <ul id="cells"></ul>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const dropZone = document.getElementById('drop');
const list = document.getElementById('cells');

// The make-or-break behavior ADR-0002 measures on this side: a real OS
// drag of plain text, received by the webview without the panel ever
// taking focus. Tauri's native DragDropEvent is file-paths-only (see
// tauri-runtime's DragDropEvent), so text drags are handled here at the
// WebKit/HTML5 DnD layer instead — the parallel to swift-panel's
// `.onDrop(of: [.plainText])`.
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('over');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', async (e) => {
  e.preventDefault();
  dropZone.classList.remove('over');
  const text = e.dataTransfer.getData('text/plain');
  if (!text) return;
  await invoke('receive_drop', { text });
  await refresh();
});

async function refresh() {
  const cells = await invoke('list_cells');
  list.innerHTML = '';
  for (const cell of cells) {
    const li = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = `${cell.recognition} — ${cell.remaining_label}`;
    const discard = document.createElement('button');
    discard.textContent = 'discard';
    discard.onclick = async () => { await invoke('discard_cell', { id: cell.id }); await refresh(); };
    li.append(label, discard);
    list.appendChild(li);
  }
}

// Redraw only while the panel is actually shown (docs/spec/05 frugality
// budget: no wakeups while hidden). Rust drives visibility directly
// through AppKit (bypassing Tauri's own show/hide, see src-tauri —
// tauri's window state doesn't know about it), so it tells us via this
// event rather than a window-visibility API.
let redrawTimer = null;
listen('panel-visibility', (event) => {
  if (event.payload.visible) {
    refresh();
    if (!redrawTimer) redrawTimer = setInterval(refresh, 1000);
  } else if (redrawTimer) {
    clearInterval(redrawTimer);
    redrawTimer = null;
  }
});
</script>
</body>
</html>
